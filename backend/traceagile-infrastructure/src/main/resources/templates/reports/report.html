<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
<meta charset="UTF-8" />
<title th:text="${doc.title()}">Rapport</title>
<style>
  @page { size: A4; margin: 16mm 14mm 18mm 14mm;
    @bottom-left { content: element(footer); }
    @bottom-right { content: "Page " counter(page) " / " counter(pages); font-family: Helvetica, Arial, sans-serif; font-size: 8pt; color: #868e96; } }
  body { font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #212529; line-height: 1.4; margin: 0; }
  .page { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .pdf .page { max-width: none; padding: 0; }
  .brand { color: #1c7ed6; font-weight: bold; letter-spacing: 1px; font-size: 9pt; text-transform: uppercase; }
  h1 { font-size: 20pt; margin: 4px 0 2px 0; }
  .subtitle { color: #495057; margin: 0 0 12px 0; font-size: 11pt; }
  table.meta { border-collapse: collapse; margin-bottom: 16px; }
  table.meta th { text-align: left; color: #868e96; font-weight: normal; padding: 1px 16px 1px 0; vertical-align: top; }
  table.meta td { padding: 1px 0; }
  .toc { background: #f8f9fa; border: 1px solid #e9ecef; padding: 8px 16px; margin-bottom: 16px; }
  .toc h2 { font-size: 11pt; margin: 4px 0; border: none; }
  .toc ol { margin: 4px 0; padding-left: 0; list-style: none; }
  .toc a { color: #1c7ed6; text-decoration: none; }
  h2 { font-size: 13pt; color: #1864ab; border-bottom: 2px solid #d0ebff; padding-bottom: 3px; margin: 20px 0 8px 0; }
  .section { page-break-inside: auto; }
  p { margin: 6px 0; }
  table.figures { width: 100%; border-collapse: separate; border-spacing: 6px; margin: 4px -6px; }
  table.figures td { border: 1px solid #dee2e6; border-left-width: 4px; padding: 6px 8px; vertical-align: top; width: 25%; }
  table.figures td.good { border-left-color: #40c057; }
  table.figures td.warn { border-left-color: #fd7e14; }
  table.figures td.bad { border-left-color: #fa5252; }
  table.figures td.neutral { border-left-color: #74c0fc; }
  .figure-value { font-size: 13pt; font-weight: bold; }
  .figure-label { color: #868e96; font-size: 8.5pt; }
  .callout { border: 1px solid; border-left-width: 6px; padding: 8px 12px; margin: 8px 0; page-break-inside: avoid; }
  .callout.good { border-color: #40c057; background: #ebfbee; }
  .callout.warn { border-color: #fd7e14; background: #fff4e6; }
  .callout.bad { border-color: #fa5252; background: #fff5f5; }
  .callout.neutral { border-color: #74c0fc; background: #e7f5ff; }
  .callout-title { font-weight: bold; font-size: 11pt; }
  table.data { width: 100%; border-collapse: collapse; margin: 6px 0 10px 0; font-size: 9pt; }
  table.data caption { text-align: left; font-weight: bold; padding: 4px 0; caption-side: top; }
  table.data th { background: #e7f5ff; text-align: left; padding: 4px 6px; border-bottom: 1px solid #a5d8ff; }
  table.data td { padding: 3px 6px; border-bottom: 1px solid #f1f3f5; vertical-align: top; }
  table.data tr { page-break-inside: avoid; }
  .chart { margin: 8px 0 12px 0; page-break-inside: avoid; }
  .chart-title { font-weight: bold; margin-bottom: 4px; }
  table.bars { width: 100%; border-collapse: collapse; }
  table.bars td { padding: 2px 4px; font-size: 9pt; }
  table.bars td.bar-label { width: 28%; text-align: right; color: #495057; }
  table.bars td.bar-value { width: 12%; color: #495057; }
  .bar-track { background: #f1f3f5; height: 12px; }
  .bar { height: 12px; }
  table.columns { border-collapse: collapse; width: 100%; table-layout: fixed; }
  table.columns td { vertical-align: bottom; text-align: center; padding: 0 1px; border-bottom: 1px solid #adb5bd; height: 150px; }
  table.columns td.column-label { height: auto; border: none; font-size: 7.5pt; color: #495057; padding-top: 2px; vertical-align: top; }
  .col { display: inline-block; width: 9px; margin: 0 1px; vertical-align: bottom; }
  .legend { font-size: 8.5pt; color: #495057; margin-top: 4px; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 10px; vertical-align: middle; }
  ul { margin: 4px 0 8px 18px; padding: 0; }
  .footer { font-size: 8pt; color: #868e96; }
  .screen-footer { margin-top: 32px; border-top: 1px solid #dee2e6; padding-top: 6px; }
  .running-footer { position: running(footer); }
</style>
</head>
<body th:class="${pdf} ? 'pdf' : 'screen'">
<div class="running-footer footer" th:if="${pdf}" th:text="${doc.footer()}">pied</div>
<div class="page">
  <div class="brand">TraceAgile</div>
  <h1 th:text="${doc.title()}">Titre</h1>
  <p class="subtitle" th:text="${doc.subtitle()}">Périmètre</p>
  <table class="meta">
    <tr th:each="m : ${doc.meta()}"><th th:text="${m.label()}">Libellé</th><td th:text="${m.value()}">Valeur</td></tr>
  </table>

  <div class="toc" th:if="${doc.sections().size() > 2}">
    <h2>Sommaire</h2>
    <ol><li th:each="s : ${doc.sections()}"><a th:href="${'#' + s.id()}" th:text="${s.title()}">Section</a></li></ol>
  </div>

  <div class="section" th:each="s : ${doc.sections()}" th:id="${s.id()}">
    <h2 th:text="${s.title()}">Section</h2>
    <th:block th:each="b : ${s.blocks()}" th:with="type=${b.getClass().getSimpleName()}">
      <p th:if="${type == 'Paragraph'}" th:text="${b.text()}">Texte</p>

      <table class="figures" th:if="${type == 'KeyFigures'}">
        <tr>
          <td th:each="f : ${b.figures()}" th:class="${f.tone()}">
            <div class="figure-value" th:text="${f.value()}">42</div>
            <div class="figure-label" th:text="${f.label()}">Indicateur</div>
          </td>
        </tr>
      </table>

      <div th:if="${type == 'Callout'}" th:class="${'callout ' + b.tone()}">
        <div class="callout-title" th:text="${b.title()}">Titre</div>
        <div th:text="${b.text()}">Texte</div>
      </div>

      <ul th:if="${type == 'Bullets'}"><li th:each="i : ${b.items()}" th:text="${i}">Élément</li></ul>

      <table class="data" th:if="${type == 'Table'}">
        <caption th:if="${b.caption() != null}" th:text="${b.caption()}">Tableau</caption>
        <thead><tr><th th:each="h : ${b.headers()}" th:text="${h}">Colonne</th></tr></thead>
        <tbody><tr th:each="r : ${b.rows()}"><td th:each="c : ${r}" th:text="${c}">Valeur</td></tr></tbody>
      </table>

      <div class="chart" th:if="${type == 'Chart'}">
        <div class="chart-title" th:text="${b.title()}">Graphique</div>
        <table class="bars" th:if="${b.type().name() == 'BAR'}">
          <tr th:each="bar : ${charts.bars(b)}">
            <td class="bar-label" th:text="${bar.label()}">Catégorie</td>
            <td><div class="bar-track"><div class="bar" th:style="${'width:' + bar.width() + ';background:#' + bar.color()}"></div></div></td>
            <td class="bar-value" th:text="${bar.value()}">0</td>
          </tr>
        </table>
        <th:block th:if="${b.type().name() != 'BAR'}">
          <table class="columns">
            <tr>
              <td th:each="g : ${charts.columns(b)}">
                <div th:each="c : ${g.columns()}" class="col" th:title="${c.value()}"
                     th:style="${'height:' + c.height() + 'px;background:#' + c.color()}"></div>
              </td>
            </tr>
            <tr><td class="column-label" th:each="g : ${charts.columns(b)}" th:text="${g.label()}">Catégorie</td></tr>
          </table>
          <div class="legend">
            <th:block th:each="serie : ${b.series()}"><span class="swatch" th:style="${'background:#' + serie.color()}"></span><span th:text="${serie.name()}">Série</span></th:block>
            <span th:if="${b.unit() != null}" th:text="${'(' + b.unit() + ')'}">(unité)</span>
          </div>
        </th:block>
      </div>
    </th:block>
  </div>

  <div class="footer screen-footer" th:unless="${pdf}" th:text="${doc.footer()}">pied</div>
</div>
</body>
</html>

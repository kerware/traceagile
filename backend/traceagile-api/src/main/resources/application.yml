server:
  port: 8085
  forward-headers-strategy: framework

spring:
  application:
    name: traceagile-api
  datasource:
    url: ${TRACEAGILE_DB_URL:jdbc:postgresql://localhost:5433/traceagile}
    username: ${TRACEAGILE_DB_USER:traceagile}
    password: ${TRACEAGILE_DB_PASSWORD:traceagile}
  jpa:
    # Le mapping DTO se fait dans les contrôleurs, après la transaction applicative (ADR-0002) :
    # « open in view » est enregistré par OpenInViewConfig, sauf pour les flux SSE.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # NF-01 / ADR-0024 collections paresseuses chargées par lots (pas de N+1 sur les critères, pas, scopes…)
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # ADR-0024 pièces jointes de 10 Mo au plus (contrôle métier : ATTACHMENT_TOO_LARGE)
      max-file-size: 11MB
      max-request-size: 12MB

traceagile:
  security:
    # Secret de développement uniquement : surchargé par TRACEAGILE_JWT_SECRET en dehors du poste local.
    jwt-secret: ${TRACEAGILE_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-ttl: 15m
    refresh-cookie-secure: ${TRACEAGILE_COOKIE_SECURE:false}
  # §10 / ADR-0020 exécution automatisée
  automation:
    # Clé de chiffrement des jetons des serveurs d'exécution : surchargée hors du poste local.
    encryption-key: ${TRACEAGILE_ENCRYPTION_KEY:dev-only-encryption-key-change-me}
    # URL des webhooks telle que le serveur d'exécution la voit.
    callback-url: ${TRACEAGILE_CALLBACK_URL:http://localhost:8085/api/v1/execution-callbacks}
    # Heartbeat des serveurs et contrôle des timeouts (toutes les 60 s).
    scheduler-enabled: ${TRACEAGILE_AUTOMATION_SCHEDULER:true}
  demo:
    # Simulateur déclaré et appairé au démarrage du profil demo (§15.1).
    simulator-url: ${TRACEAGILE_SIMULATOR_URL:http://localhost:8090}
    simulator-admin-user: ${SIMULATOR_ADMIN_USER:admin}
    simulator-admin-password: ${SIMULATOR_ADMIN_PASSWORD:simulateur}
    # ADR-0026 serveur d'exécution réel, déclaré et appairé s'il est configuré (vide : aucun).
    execution-server-url: ${TRACEAGILE_EXECUTION_SERVER_URL:}
    execution-server-admin-user: ${EXECUTION_SERVER_ADMIN_USER:admin}
    execution-server-admin-password: ${EXECUTION_SERVER_ADMIN_PASSWORD:executeur}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

# NF-15 Journaux structurés JSON (format ECS), avec le correlationId du MDC.
logging:
  structured:
    format:
      console: ecs

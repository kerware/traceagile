# NF-14 Démarrage complet en une commande : docker compose up --build
# Front : http://localhost:3000 — API : http://localhost:8085 (Swagger UI : /swagger-ui.html)
name: traceagile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traceagile
      POSTGRES_USER: traceagile
      POSTGRES_PASSWORD: traceagile
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceagile -d traceagile"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: api
    environment:
      SPRING_PROFILES_ACTIVE: demo
      TRACEAGILE_DB_URL: jdbc:postgresql://postgres:5432/traceagile
      TRACEAGILE_DB_USER: traceagile
      TRACEAGILE_DB_PASSWORD: traceagile
      TRACEAGILE_JWT_SECRET: ${TRACEAGILE_JWT_SECRET:-compose-demo-secret-please-change-0123456789}
      # ADR-0020 chiffrement des jetons des serveurs d'exécution
      TRACEAGILE_ENCRYPTION_KEY: ${TRACEAGILE_ENCRYPTION_KEY:-compose-demo-encryption-key-please-change}
      # §10 webhooks : URL de l'API vue depuis le simulateur ; simulateur appairé au démarrage (profil demo)
      TRACEAGILE_CALLBACK_URL: http://backend:8085/api/v1/execution-callbacks
      TRACEAGILE_SIMULATOR_URL: http://mock-execution-server:8090
      # ADR-0026 serveur d'exécution réel, appairé au démarrage du profil demo (vide : non déclaré)
      TRACEAGILE_EXECUTION_SERVER_URL: ${TRACEAGILE_EXECUTION_SERVER_URL-http://execution-server:8091}
      EXECUTION_SERVER_ADMIN_USER: ${EXECUTION_SERVER_ADMIN_USER:-admin}
      EXECUTION_SERVER_ADMIN_PASSWORD: ${EXECUTION_SERVER_ADMIN_PASSWORD:-executeur}
      SIMULATOR_ADMIN_USER: ${SIMULATOR_ADMIN_USER:-admin}
      SIMULATOR_ADMIN_PASSWORD: ${SIMULATOR_ADMIN_PASSWORD:-simulateur}
      # ADR-0024 contenu des pièces jointes (FileStorage disque)
      TRACEAGILE_ATTACHMENTS_DIR: /data/attachments
    volumes:
      - attachments:/data/attachments
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

  # §10.5 simulateur du serveur d'exécution ; ADR-0020 son administrateur émet les jetons (POST /api/v1/tokens)
  mock-execution-server:
    build:
      context: ./backend
      target: mock-execution-server
    environment:
      SIMULATOR_ADMIN_USER: ${SIMULATOR_ADMIN_USER:-admin}
      SIMULATOR_ADMIN_PASSWORD: ${SIMULATOR_ADMIN_PASSWORD:-simulateur}
      # parts des tests réussis / en erreur hors @fail / @flaky (1 et 0 pour un résultat reproductible : guide saucedemo)
      SIMULATOR_PASS_RATE: ${SIMULATOR_PASS_RATE:-0.8}
      SIMULATOR_ERROR_RATE: ${SIMULATOR_ERROR_RATE:-0.05}
    ports:
      - "8090:8090"

  # ADR-0026 serveur d'exécution réel (jar autonome aussi utilisable hors de Docker) : interface sur
  # http://localhost:8091 ; outils installés à chaud dans le volume execution-tools.
  execution-server:
    build:
      context: ./backend
      dockerfile: execution-server/Dockerfile
    environment:
      EXECUTION_SERVER_ADMIN_USER: ${EXECUTION_SERVER_ADMIN_USER:-admin}
      EXECUTION_SERVER_ADMIN_PASSWORD: ${EXECUTION_SERVER_ADMIN_PASSWORD:-executeur}
      EXECUTION_SERVER_NAME: ${EXECUTION_SERVER_NAME:-executeur-docker}
      EXECUTION_SERVER_AGENTS: ${EXECUTION_SERVER_AGENTS:-4}
      # le dépôt local, monté en lecture seule, est clonable par file:///depots/traceagile (guide saucedemo) ;
      # ses fichiers appartiennent à un autre utilisateur : Git doit l'accepter (safe.directory)
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - execution-data:/data
      - execution-tools:/opt/tools
      - .:/depots/traceagile:ro
    ports:
      - "8091:8091"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  attachments:
  execution-data:
  execution-tools:

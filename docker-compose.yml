# NF-14 Démarrage complet en une commande : docker compose up --build
# Front : http://localhost:3000 — API : http://localhost:8085 (Swagger UI : /swagger-ui.html)
name: traceagile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traceagile
      POSTGRES_USER: traceagile
      POSTGRES_PASSWORD: traceagile
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceagile -d traceagile"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: api
    environment:
      SPRING_PROFILES_ACTIVE: demo
      TRACEAGILE_DB_URL: jdbc:postgresql://postgres:5432/traceagile
      TRACEAGILE_DB_USER: traceagile
      TRACEAGILE_DB_PASSWORD: traceagile
      TRACEAGILE_JWT_SECRET: ${TRACEAGILE_JWT_SECRET:-compose-demo-secret-please-change-0123456789}
      # ADR-0020 chiffrement des jetons des serveurs d'exécution
      TRACEAGILE_ENCRYPTION_KEY: ${TRACEAGILE_ENCRYPTION_KEY:-compose-demo-encryption-key-please-change}
      # §10 webhooks : URL de l'API vue depuis le simulateur ; simulateur appairé au démarrage (profil demo)
      TRACEAGILE_CALLBACK_URL: http://backend:8085/api/v1/execution-callbacks
      TRACEAGILE_SIMULATOR_URL: http://mock-execution-server:8090
      SIMULATOR_ADMIN_USER: ${SIMULATOR_ADMIN_USER:-admin}
      SIMULATOR_ADMIN_PASSWORD: ${SIMULATOR_ADMIN_PASSWORD:-simulateur}
      # ADR-0024 contenu des pièces jointes (FileStorage disque)
      TRACEAGILE_ATTACHMENTS_DIR: /data/attachments
    volumes:
      - attachments:/data/attachments
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

  # §10.5 simulateur du serveur d'exécution ; ADR-0020 son administrateur émet les jetons (POST /api/v1/tokens)
  mock-execution-server:
    build:
      context: ./backend
      target: mock-execution-server
    environment:
      SIMULATOR_ADMIN_USER: ${SIMULATOR_ADMIN_USER:-admin}
      SIMULATOR_ADMIN_PASSWORD: ${SIMULATOR_ADMIN_PASSWORD:-simulateur}
    ports:
      - "8090:8090"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  attachments:

# §16.2 Lot 0 — CI : build, tests et lint du back-end et du front-end.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (Maven, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build et tests (unitaires, intégration PostgreSQL, ArchUnit ; jar du serveur d'exécution avec son interface)
        run: mvn -B verify
      - name: Contrat OpenAPI à jour
        working-directory: .
        run: git diff --exit-code -- frontend/openapi/traceagile-api.json
      - name: Rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/site/jacoco/
      - name: Jar autonome du serveur d'exécution (ADR-0026)
        uses: actions/upload-artifact@v4
        with:
          name: execution-server-jar
          path: backend/execution-server/target/execution-server.jar

  installation:
    name: Installation hors Docker (ADR-0027)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Distribution (deux jars, scripts, démo)
        run: scripts/construire-distribution.sh
      - name: Base avec la démo SwagLabs
        working-directory: dist/traceagile-0.1.0/base-de-donnees
        run: ./installer-base.sh --mot-de-passe ci-traceagile --demo --url-serveur http://executeur:8091 --pieces-jointes "$RUNNER_TEMP/pj"
      - name: Démarrage du jar et connexion d'un compte de la démo
        working-directory: dist/traceagile-0.1.0/traceagile
        run: |
          sed -e 's#^TRACEAGILE_DB_PASSWORD=.*#TRACEAGILE_DB_PASSWORD=ci-traceagile#'               -e "s#^TRACEAGILE_ATTACHMENTS_DIR=.*#TRACEAGILE_ATTACHMENTS_DIR=$RUNNER_TEMP/pj#" traceagile.env.exemple > traceagile.env
          ./demarrer.sh > traceagile.log 2>&1 &
          for i in $(seq 1 60); do curl -fs localhost:8085/actuator/health | grep -q UP && break; sleep 2; done
          curl -fs localhost:8085/ | grep -q '<div id="root">'
          TOKEN=$(curl -fs -X POST localhost:8085/api/v1/auth/login -H 'Content-Type: application/json'             -d '{"login":"po","password":"SwagLabs-2026"}' | jq -r .accessToken)
          curl -fs localhost:8085/api/v1/projects -H "Authorization: Bearer $TOKEN" | jq -e '.content[] | select(.key == "SWAG")'
      - name: Journal de TraceAgile
        if: failure()
        run: |
          cat dist/traceagile-0.1.0/traceagile/traceagile.log 2>/dev/null || echo "Pas de journal, TraceAgile n'a pas démarré (voir l'étape en échec)."

  frontend:
    name: Front-end (lint, tsc, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Client API généré à jour
        run: npm run api:generate && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  execution-server-ui:
    name: Interface du serveur d'exécution (lint, tsc, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/execution-server/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/execution-server/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Bout en bout (Docker Compose + Playwright, §15.3)
    runs-on: ubuntu-latest
    needs: [backend, frontend, execution-server-ui]
    steps:
      - uses: actions/checkout@v4
      - name: Démarrage de la pile (NF-14)
        run: docker compose up --build -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Parcours de référence
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
      - name: Journaux de la pile
        if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log

# §16.2 Lot 0 — CI : build, tests et lint du back-end et du front-end.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (Maven, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build et tests (unitaires, intégration PostgreSQL, ArchUnit)
        run: mvn -B verify
      - name: Contrat OpenAPI à jour
        working-directory: .
        run: git diff --exit-code -- frontend/openapi/traceagile-api.json
      - name: Rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/site/jacoco/

  frontend:
    name: Front-end (lint, tsc, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Client API généré à jour
        run: npm run api:generate && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

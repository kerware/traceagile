# Sert le front (SPA) et relaie /api vers le back-end : même origine, pas de CORS (NF-09).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # ADR-0024 pièces jointes (10 Mo) et import de rapports
    client_max_body_size 12m;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (lot 7) : pas de mise en tampon.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html jamais mis en cache : après un redéploiement, il doit désigner les nouveaux morceaux
    # JavaScript (les anciens n'existent plus). Un add_header dans un location remplace ceux du
    # server : les en-têtes de sécurité sont donc répétés.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'none'" always;
    }

    # Guide d'utilisation (menu « Documentation ») : page autonome sans script, captures en data URI,
    # polices Google Fonts autorisées.
    location /guide/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'" always;
    }
}
